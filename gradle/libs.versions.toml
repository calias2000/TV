# Single source of truth for every library and plugin version.
# Change a version here, never inside a module's build file.

[versions]
agp = "9.5.1"
kotlin = "2.4.21"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
tvMaterial = "1.1.0"
media3 = "1.11.1"
lifecycle = "2.11.0"
navigation3 = "1.2.1"
datastore = "1.3.0"
# Image loading (logos and posters).
coil = "3.6.3"
# XML pull parser API for :core. Android ships the implementation; kxml2 is the same one, for JVM tests.
xmlpull = "1.1.3.1"
kxml2 = "2.3.0"
# Tests of :app (run on the JVM, no device): JUnit 4 is what Robolectric and Compose UI tests need.
junit = "4.13.2"
robolectric = "4.17"
coroutinesTest = "1.10.2" # same version as the coroutines the app already runs on

[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
tv-material = { group = "androidx.tv", name = "tv-material", version.ref = "tvMaterial" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-ui-compose = { group = "androidx.media3", name = "media3-ui-compose", version.ref = "media3" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
navigation3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "navigation3" }
navigation3-ui = { group = "androidx.navigation3", name = "navigation3-ui", version.ref = "navigation3" }
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
xmlpull = { group = "xmlpull", name = "xmlpull", version.ref = "xmlpull" }
kxml2 = { group = "net.sf.kxml", name = "kxml2", version.ref = "kxml2" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
# Compose compiler must stay on the same version as Kotlin.
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
