name: CI/CD
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6.4.1
      - run: ./gradlew test

  # A push to main whose version (`appVersion` in app/build.gradle.kts) has no GitHub release yet, and only when the
  # tests pass: builds the release APK and publishes it as the release v<version>. Raise the version to publish.
  release:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Find the version, and whether it is released already
        id: version
        run: |
          version=$(sed -n 's/^val appVersion = "\(.*\)"/\1/p' app/build.gradle.kts)
          test -n "$version" || { echo "appVersion not found in app/build.gradle.kts"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.version.outputs.new == 'true'
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "25"
      - if: steps.version.outputs.new == 'true'
        uses: gradle/actions/setup-gradle@v6.4.1
      - name: Restore the signing key
        if: steps.version.outputs.new == 'true'
        env:
          KEYSTORE: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE" || { echo "Secret DEBUG_KEYSTORE_BASE64 is not set"; exit 1; }
          mkdir -p ~/.android
          echo "$KEYSTORE" | base64 --decode > ~/.android/debug.keystore
      - name: Build the release APK
        if: steps.version.outputs.new == 'true'
        run: ./gradlew :app:assembleRelease -PbackendBase=${{ vars.BACKEND_BASE }}
      - name: Publish the release
        if: steps.version.outputs.new == 'true'
        run: gh release create "v${{ steps.version.outputs.version }}" "app/build/outputs/apk/release/app-release.apk#calias-tv.apk" --target "$GITHUB_SHA" --generate-notes
