# Screens are tested through the semantics tree (text, clicks), not pixels, so the lighter legacy graphics
# mode is enough. The native one fails on JDK 25 (it reads java.io internals).
graphicsMode=LEGACY
# Robolectric 4.17 runs the Android 16 (API 36) framework without trouble; with API 37 (the app's target) it fails to start.
sdk=36
